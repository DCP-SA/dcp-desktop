[package]
name = "dcp-desktop"
version = "0.2.3"
description = "DCP GPU Compute Provider Desktop App"
authors = ["DCP <engineering@dcp.sa>"]
edition = "2021"

[lib]
name = "dcp_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hostname = "0.4"
open = "5"
dirs = "5"
num_cpus = "1.16"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1", features = ["full"] }
# L4 — human-readable ISO timestamps in startup/GPU logs
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# G19 — sha256 manifest verify on update_daemon
sha2 = "0.10"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi"] }
winreg = "0.52"
