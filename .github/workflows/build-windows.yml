name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Windows installer (signed for auto-update)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: List all bundle files
        run: |
          echo "=== NSIS ==="
          dir src-tauri\target\release\bundle\nsis\ 2>nul || echo "no nsis dir"
          echo "=== MSI ==="
          dir src-tauri\target\release\bundle\msi\ 2>nul || echo "no msi dir"

      - name: Upload NSIS installer (.exe for manual download)
        uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload NSIS update bundle (.nsis.zip + .sig for auto-update)
        uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-windows-update
          path: |
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig

      - name: Upload MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
