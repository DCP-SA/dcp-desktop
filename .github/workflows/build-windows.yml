name: Build Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build

      - name: Build Tauri Windows installer (signed)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: List bundle files
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri\target\release\bundle\nsis\ -EA SilentlyContinue | ft Length,Name

      - uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcp-provider-windows-update
          path: |
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
