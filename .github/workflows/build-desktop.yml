name: Build Desktop (macOS / Windows / Linux)

# Builds DCP Provider for all three desktop OSes on every push to main
# and on tag pushes. Linux job produces both .AppImage and .deb.
# Tag pushes additionally publish artifacts to a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── macOS ─────────────────────────────────────────────────────────────
  build-macos:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build

      - name: Build Tauri macOS bundle (signed)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: List bundle files
        run: ls -lah src-tauri/target/release/bundle/dmg/ src-tauri/target/release/bundle/macos/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcp-provider-macos-update
          path: |
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          if-no-files-found: ignore

      - name: Attach artifacts to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/macos/*.sig
          fail_on_unmatched_files: false

  # ── Windows ───────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows (NSIS / MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build

      - name: Build Tauri Windows installer (signed)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: List bundle files
        shell: pwsh
        run: Get-ChildItem -Recurse src-tauri\target\release\bundle\nsis\ -EA SilentlyContinue | ft Length,Name

      - uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-windows-setup
          path: src-tauri/target/release/bundle/nsis/*.exe

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcp-provider-windows-update
          path: |
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-windows-msi
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: ignore

      - name: Attach artifacts to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: false

  # ── Linux ─────────────────────────────────────────────────────────────
  build-linux:
    name: Build Linux (.AppImage + .deb)
    # ubuntu-22.04 chosen for better GLIBC compat than ubuntu-latest (24.04).
    # Older glibc => binaries run on more user systems.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          # Tauri v2 on ubuntu-22.04 uses webkit2gtk-4.1 (4.0 was renamed in
          # 22.04 jammy-updates). libayatana-appindicator3 covers the tray
          # icon, librsvg2 the icon transcoding, wireguard-tools is needed
          # at runtime and used at build time so the .deb's Depends list is
          # honest. linuxdeploy + appimage-builder come from Tauri's own
          # bundler so we don't install them here.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            wireguard-tools \
            file \
            libxdo-dev \
            build-essential \
            curl \
            wget

      - run: npm ci
      - run: npm run build

      - name: Build Tauri Linux bundle (.AppImage + .deb)
        # bundle.targets is "all" in tauri.conf.json so npx tauri build
        # auto-emits both AppImage and deb on Linux. No need to pass
        # --bundles.
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: List bundle files
        run: |
          echo "── AppImage ──"; ls -lah src-tauri/target/release/bundle/appimage/ || true
          echo "── deb ──";      ls -lah src-tauri/target/release/bundle/deb/      || true

      - uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: dcp-provider-linux-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dcp-provider-linux-update
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
          if-no-files-found: ignore

      - name: Attach artifacts to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/appimage/*.sig
            src-tauri/target/release/bundle/deb/*.deb
          fail_on_unmatched_files: false
